<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Market Cap &amp; DPS Booklet</title>
<style>
:root{
  --navy:#16213e; --navy2:#2a3656; --gold:#c8922a; --ink:#1a1a2e; --muted:#5b6275;
  --line:#cfd4e0; --soft:#f3f4f8;
  --green:#2e7d4f; --greenbg:#e6f2ea; --amber:#b86e00; --amberbg:#fbf0dc;
  --purple:#6b3fa0; --purplebg:#efe8f7; --red:#b3261e; --redbg:#fdf0ef;
  --sans:"Helvetica Neue",Arial,Helvetica,sans-serif; --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#dfe2ea;color:var(--ink);font-family:var(--sans)}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ---------- toolbar (screen only) ---------- */
.toolbar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px}
.toolbar .brand{font-weight:800;letter-spacing:.08em;font-size:14px}
.toolbar .brand span{color:var(--gold)}
.toolbar .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid #56618a;border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:#cdd3e6;border:0;padding:8px 12px;font:600 13px var(--sans);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy)}
.printbtn{background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:9px 16px;font:800 13px var(--sans);cursor:pointer}
.tip{width:100%;font-size:12px;color:#b9c1da}
.sheets{padding:16px 0}

/* ---------- page ---------- */
.page{width:210mm;height:297mm;margin:0 auto 8mm;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18);position:relative;padding:9mm 13mm 0;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;justify-content:space-between;align-items:center;font-size:8.5pt;padding-bottom:2.2mm;border-bottom:1.4px solid var(--navy);margin-bottom:4mm}
.phead .b{font-weight:800;letter-spacing:.06em}
.phead .b span{color:var(--gold)}
.phead .mid{font-weight:700}
.pbody{flex:1;min-height:0}
.pfoot{height:13mm;flex:none;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:7.5pt;color:var(--muted)}
.pnum{background:var(--navy);color:#fff;font-weight:800;font-size:9pt;border-radius:12px;padding:1.2mm 3.8mm}
.student .t-only,.teacher .s-only{display:none}

/* ---------- banners ---------- */
.banner{background:var(--navy);color:#fff;border-radius:3mm;padding:4.5mm 6mm;margin-bottom:4mm}
.kick{color:var(--gold);font-size:7.5pt;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.banner h2{font-size:18pt;margin:.6mm 0 .8mm}
.banner p{font-size:9pt;color:#dfe4f2}
.fstrip{background:var(--navy2);border-radius:1.5mm;padding:2mm 3.5mm;margin-top:2.5mm;font-size:8.5pt;font-weight:700}

/* ---------- cover ---------- */
.hero{background:var(--navy);color:#fff;border-radius:4mm;padding:10mm 9mm 9mm;position:relative;overflow:hidden;margin-bottom:5mm}
.hero .kick{font-size:9pt;letter-spacing:.2em}
.hero h1{font-size:28pt;line-height:1.1;margin:4mm 0 3mm}
.hero p{font-size:11pt;color:#dfe4f2}
.hero .wm{position:absolute;right:-4mm;bottom:-9mm;font-size:48pt;font-weight:900;color:rgba(255,255,255,.05);letter-spacing:.2em}
.ncd{display:grid;grid-template-columns:2.5fr 1.2fr 1.2fr;border:1.3px solid var(--navy);border-radius:2.5mm;background:#fff;margin-bottom:5mm}
.ncd div{padding:2.5mm 3.5mm;height:14mm;font-size:8.5pt;font-weight:800;letter-spacing:.06em;color:var(--navy)}
.ncd div+div{border-left:1px solid var(--navy)}
h3.cap{font-size:11pt;letter-spacing:.07em;text-transform:uppercase;color:var(--navy);margin:0 0 2.5mm}
.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:3.5mm;margin-bottom:5mm}
.route{border:1px solid var(--line);border-top:4px solid;border-radius:2mm;padding:3mm 3.5mm;font-size:8.8pt;line-height:1.45}
.route b.t{display:block;font-size:10.5pt;margin-bottom:1.5mm}
.route .mine{color:var(--muted);font-size:8pt;margin-top:2mm}
.box{display:inline-block;width:3.4mm;height:3.4mm;border:1.2px solid var(--ink);border-radius:.8mm;vertical-align:-.6mm;margin-left:1mm;background:#fff}
.r1{border-top-color:var(--green)} .r1 b.t{color:var(--green)}
.r2{border-top-color:var(--amber)} .r2 b.t{color:var(--amber)}
.r3{border-top-color:var(--purple)} .r3 b.t{color:var(--purple)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin-bottom:2mm}
.step{background:var(--soft);border:1px solid var(--line);border-radius:2mm;padding:3mm;font-size:8.5pt;line-height:1.45}
.step i{display:flex;width:6.5mm;height:6.5mm;border-radius:50%;background:var(--navy);color:#fff;font:800 9pt var(--sans);align-items:center;justify-content:center;margin-bottom:1.8mm}
.step:first-child i{background:var(--red)}
.note{font-size:8pt;color:var(--muted);margin-bottom:5mm;line-height:1.4}
.toc{font-size:10pt}
.toc div{display:flex;justify-content:space-between;padding:2mm 1mm;border-bottom:1px dashed #9aa2b5}
.toc b{color:var(--navy)}

/* ---------- toolkit ---------- */
.tk{display:grid;grid-template-columns:1fr 1fr;gap:3.5mm}
.card{border:1px solid var(--line);border-radius:2.5mm;padding:3.2mm 4mm;font-family:var(--serif);font-size:9pt;line-height:1.45}
.card h4{font:700 10.5pt var(--sans);color:var(--navy);margin-bottom:1.5mm}
.card .f{background:#edf0f6;border-radius:1.5mm;padding:2mm 3mm;font:700 10pt var(--sans);color:var(--navy);margin:2mm 0}
.card ul{padding-left:4.5mm}
.card li{margin-bottom:1mm}
.card svg{display:block;margin:1mm auto}
.card.warn{background:var(--redbg);border-color:#efc6c2} .card.warn h4{color:var(--red)}
.card.str{background:var(--purplebg);border-color:#d7c7ea} .card.str h4{color:var(--purple)}
.card.str .f{background:#fff}
.card.we{grid-column:1/-1;border:1.3px solid var(--navy)}
.card.we p{margin:1mm 0}

/* ---------- question cards ---------- */
.q{border:1px solid var(--line);border-left:5px solid var(--green);border-radius:2mm;padding:2.6mm 4mm 2.2mm;margin-bottom:3.2mm;break-inside:avoid}
.q.l2{border-left-color:var(--amber)} .q.l3{border-left-color:var(--purple)}
.qh{display:flex;align-items:center;gap:2.5mm;margin-bottom:1.6mm}
.qh .n{font-weight:800;font-size:11.5pt;color:var(--navy)}
.bdg{font-size:7.5pt;font-weight:700;padding:.7mm 2.2mm;border-radius:1mm;background:var(--greenbg);color:var(--green)}
.l2 .bdg{background:var(--amberbg);color:var(--amber)} .l3 .bdg{background:var(--purplebg);color:var(--purple)}
.why{font-size:7pt;font-weight:800;letter-spacing:.08em;background:var(--purple);color:#fff;padding:.7mm 2mm;border-radius:1mm}
.qt{font-family:var(--serif);font-size:9.8pt;line-height:1.45;margin-bottom:2mm}
.work{border:1px solid #dde1ea;border-radius:1.5mm;background-image:radial-gradient(circle,#b9bfcc .45mm,transparent .5mm);background-size:5mm 5mm;background-position:2mm 2mm;position:relative;margin-bottom:1.5mm}
.work::before{content:"WORKING";position:absolute;top:.8mm;left:3mm;font-size:6.5pt;letter-spacing:.1em;color:#8b93a6;background:#fff;padding:0 1mm}
.ln{display:flex;align-items:flex-end;gap:1.8mm;font-weight:700;font-size:9.6pt;margin:2.2mm 0 1.4mm;white-space:nowrap}
.bl{flex:1;min-width:14mm;border-bottom:1.3px solid var(--navy);height:5mm}
.wl{height:7.2mm;border-bottom:1px solid #c3c9d6}
.stuck{display:flex;align-items:center;flex-wrap:wrap;gap:1.4mm;border-top:1px dashed var(--line);padding-top:1.8mm;margin-top:2mm;font-size:7.2pt}
.stuck .sr{background:var(--red);color:#fff;font-weight:800;padding:.8mm 2mm;border-radius:1mm;letter-spacing:.02em}
.stuck .c{border:1px solid #b8bfcd;border-radius:1mm;padding:.5mm 1.8mm}
.stuck .ar{color:#9aa2b5}
.stuck .used{margin-left:auto;color:var(--muted)}
.dt{width:100%;border-collapse:collapse;font-size:9.4pt;margin:1mm 0 2mm;font-family:var(--serif)}
.dt th,.dt td{border:1px solid #c9cfdc;padding:1.7mm 2.5mm;text-align:left;height:7.5mm}
.dt th{background:#edf0f6;font-weight:700}
.dt td.blank{border-style:dashed;border-color:var(--green);background:#fff}

/* ---------- case study ---------- */
.co{border:1px solid var(--line);border-radius:2.5mm;padding:3.2mm 4.5mm;margin-bottom:3.5mm;font-family:var(--serif);font-size:9.6pt;line-height:1.5}
.co b.h{display:block;font-size:10pt;margin-bottom:1mm}
.cs{width:100%;border-collapse:collapse;font-size:10pt;margin-top:2mm}
.cs th{background:var(--navy);color:#fff;text-align:left;padding:2.6mm 3.5mm}
.cs td{padding:2.8mm 3.5mm;border-bottom:1px solid var(--line)}
.cs td:first-child{font-weight:700;color:var(--navy)}
.cs tr:nth-child(even) td{background:var(--soft)}
.small{font-size:7.8pt;color:var(--muted);margin-top:2mm}

/* ---------- reflection ---------- */
.rt{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:5mm}
.rt th,.rt td{border:1px solid #c9cfdc;padding:2.4mm 3mm;text-align:left}
.rt th{background:#edf0f6}
.rt td{height:9mm}
.rag{white-space:nowrap}
.rag i{display:inline-block;width:4.6mm;height:4.6mm;border-radius:50%;border:1.3px solid;margin-right:1.2mm;vertical-align:middle}
.rag i:nth-child(1){border-color:var(--red)} .rag i:nth-child(2){border-color:var(--gold)} .rag i:nth-child(3){border-color:var(--green)}
.bigwork{height:100%;border:1px solid #dde1ea;border-radius:2mm;background-image:radial-gradient(circle,#b9bfcc .45mm,transparent .5mm);background-size:5mm 5mm;background-position:2mm 2mm}

/* ---------- clue banks ---------- */
.cols{column-count:2;column-gap:4.5mm}
.cols h5{font-size:9.5pt;letter-spacing:.07em;color:var(--navy);border-bottom:1.5px solid var(--navy);padding-bottom:1mm;margin:0 0 2.5mm;break-after:avoid}
.clue{border:1px solid var(--line);border-radius:2mm;margin-bottom:2.8mm;break-inside:avoid;overflow:hidden;font-size:9pt}
.clue .ch{display:flex;align-items:baseline;gap:2mm;padding:1.4mm 3mm;background:var(--greenbg)}
.clue .ch b{font-size:10.5pt;color:var(--navy)}
.clue .ch span{font-size:7pt;font-weight:800;letter-spacing:.08em;color:var(--green)}
.clue .ch em{margin-left:auto;font-style:normal;font-size:8pt;color:var(--green)}
.clue.l2 .ch{background:var(--amberbg)} .clue.l2 .ch span,.clue.l2 .ch em{color:var(--amber)}
.clue.l3 .ch{background:var(--purplebg)} .clue.l3 .ch span,.clue.l3 .ch em{color:var(--purple)}
.clue .cb{padding:2mm 3mm;font-family:var(--serif);line-height:1.45}
.clue .cf{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding:1.1mm 3mm;font-size:7.3pt;color:var(--muted)}
.clue .cf b{color:var(--navy)}
.banner.red{background:var(--red)}

/* ---------- teacher pages ---------- */
.at{width:100%;border-collapse:collapse;font-size:8.6pt;margin-bottom:4mm}
.at th{background:var(--navy);color:#fff;text-align:left;padding:1.8mm 2.5mm}
.at td{border-bottom:1px solid var(--line);padding:1.6mm 2.5mm;vertical-align:top;line-height:1.4}
.at td:nth-child(1){font-weight:800;width:10mm;color:var(--navy)}
.at td:nth-child(2){width:12mm;white-space:nowrap}
.at td:nth-child(3){width:10mm;color:var(--muted)}
.at tr:nth-child(even) td{background:var(--soft)}
.at h6{font-size:10pt}
h4.sh{font-size:11pt;color:var(--navy);margin:1mm 0 2mm}
.tips{border:1.3px solid var(--navy);border-radius:2.5mm;padding:3.5mm 4.5mm;font-size:9pt;line-height:1.5}
.tips li{margin:0 0 1.2mm 4.5mm}

@media screen and (max-width:830px){ .toolbar .tip{display:none} }
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  .toolbar{display:none}
  .sheets{padding:0;zoom:1 !important}
  .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body class="student">

<div class="toolbar">
  <div class="brand">BIZ<span>-</span>OMICS · Market Cap &amp; DPS</div>
  <div class="ctrls">
    <div class="seg">
      <button id="bS" class="on" onclick="setMode('student')">Student booklet (24 pp)</button>
      <button id="bT" onclick="setMode('teacher')">Teacher answers (3 pp)</button>
    </div>
    <button class="printbtn" onclick="window.print()">🖨 Print</button>
  </div>
  <div class="tip">Print on A4, scale 100% (or “Default”), margins “None”, and tick “Background graphics”. The print button prints whichever version is showing.</div>
</div>

<div class="sheets" id="sheets"></div>

<script>
/* ============ helpers ============ */
const LV={1:{c:'l1',n:'Foundation',s:'★'},2:{c:'l2',n:'Core',s:'★★'},3:{c:'l3',n:'Stretch',s:'★★★'}};
const FOOT='Stuck? Toolkit p.2 · Clue A (Nudges) · Clue B (Start me off) at the back';
function page(n,mid,body,cls){
  return `<section class="page ${cls||'s-only'}"><div class="phead"><span class="b">BIZ<span>-</span>OMICS</span><span class="mid">${mid}</span><span>Market Cap &amp; DPS · 3.1.2</span></div><div class="pbody">${body}</div><div class="pfoot"><span>${n==='T'?'Teacher answer booklet · not for students':FOOT}</span>${n==='T'?'':`<span class="pnum">${n}</span>`}</div></section>`;
}
function banner(k,h,p,strip,extra){return `<div class="banner ${extra||''}"><div class="kick">${k}</div><h2>${h}</h2>${p?`<p>${p}</p>`:''}${strip?`<div class="fstrip">${strip}</div>`:''}</div>`}
function line(s){return `<div class="ln">`+s.split('_').map((t,i,a)=>`<span>${t}</span>`+(i<a.length-1?'<span class="bl"></span>':'')).join('')+`</div>`}
function qPage(id){const[s,n]=id.split('.').map(Number);const m={1:[3,3,3,4,4,4,5,5,5,5],2:[6,6,6,6,7,7,7,7,8,8],3:[9,9,9,10,10,10,11,11,11,11],4:[13,13,13,14,14,14,14,15,15]};return m[s][n-1]}
function aPage(id){const[s,n]=id.split('.').map(Number);if(s===1||(s===2&&n<=4))return 19;if(s===4)return 21;return 20}
function bPage(id){const[s,n]=id.split('.').map(Number);if(s===1||(s===2&&n<=4))return 22;if(s===4||(s===3&&n>=9))return 24;return 23}
function Q(o){
  const L=LV[o.lv];
  let h=`<div class="q ${L.c}"><div class="qh"><span class="n">${o.id}</span><span class="bdg">${L.s} ${L.n}</span>${o.why?'<span class="why">TELL ME WHY</span>':''}</div><div class="qt">${o.t}</div>`;
  if(o.table)h+=o.table;
  if(o.work)h+=`<div class="work" style="height:${o.work}mm"></div>`;
  (o.lines||[]).forEach(s=>h+=line(s));
  if(o.write)h+=Array(o.write).fill('<div class="wl"></div>').join('');
  h+=`<div class="stuck"><span class="sr">STUCK? STOP &amp; SEARCH</span><span class="c">1 Toolkit <b>p.2</b></span><span class="ar">→</span><span class="c">2 Nudge <b>${o.id}A · p.${aPage(o.id)}</b></span><span class="ar">→</span><span class="c">3 Start me off <b>${o.id}B · p.${bPage(o.id)}</b></span><span class="used">I used: A <span class="box"></span>&nbsp; B <span class="box"></span></span></div></div>`;
  return h;
}
function tbl(head,rows){ // rows: arrays; '' = blank answer cell
  return `<table class="dt"><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>c===''?'<td class="blank"></td>':(i===0?`<td><b>${c}</b></td>`:`<td>${c}</td>`)).join('')}</tr>`).join('')}</table>`;
}

/* ============ questions ============ */
const S1='Section 1: Calculate it',S2='Section 2: Rearrange it',S3='Section 3: Change it',S4='Section 4: Case study';
const QS={
'1.1':{lv:1,t:'Northgate Bakeries plc has <b>10 million</b> shares. Its share price is <b>£4</b>. Calculate its market capitalisation.',work:34,lines:['Market capitalisation = £ _']},
'1.2':{lv:1,t:'Pennine Cycles plc has <b>8 million</b> shares. Its share price is <b>£2.50</b>. Calculate its market capitalisation.',work:34,lines:['Market capitalisation = £ _']},
'1.3':{lv:1,t:'Aire Valley Printing plc paid total dividends of <b>£3 million</b> to its shareholders. It has <b>12 million</b> shares. Calculate the dividend per share (DPS). Give your answer in <b>pence</b>.',work:30,lines:['DPS = £ _','DPS = _ p']},
'1.4':{lv:1,t:'Complete the market capitalisation column. Then answer: which company is the largest by market capitalisation?',table:tbl(['Company','Share price','Number of shares','Market capitalisation'],[['W plc','£1.50','20 million',''],['X plc','£6.00','5 million',''],['Y plc','£0.80','50 million',''],['Z plc','£12.00','3 million','']]),work:20,lines:['Largest company: _']},
'1.5':{lv:2,t:'Calder Engineering plc has a share price of <b>340p</b> and <b>50 million</b> shares. Calculate its market capitalisation in <b>£ millions</b>.',work:30,lines:['Market capitalisation = £ _ million']},
'1.6':{lv:2,t:'Swale Housing plc paid total dividends of <b>£7.2 million</b>. It has <b>90 million</b> shares. Calculate the DPS in <b>pence</b>.',work:30,lines:['DPS = _ p']},
'1.7':{lv:2,t:'Complete the DPS column. Give each answer in <b>pence</b>.',table:tbl(['Company','Total dividends paid','Number of shares','DPS (pence)'],[['P plc','£4.5 million','30 million',''],['Q plc','£660,000','12 million',''],['R plc','£18 million','240 million','']]),work:19},
'1.8':{lv:3,t:'Wharfedale Group plc has <b>2.4 billion</b> shares and a share price of <b>1,275p</b>. Calculate its market capitalisation in <b>£ billions</b>.',work:20,lines:['Market capitalisation = £ _ billion']},
'1.9':{lv:3,t:'Wharfedale Group plc paid total dividends of <b>£1.14 billion</b> last year. Calculate the DPS in <b>pence</b>.',work:18,lines:['DPS = _ p']},
'1.10':{lv:3,why:1,t:'<b>Tell me why:</b> Look back at 1.4. Y plc has the lowest share price but the highest market capitalisation. Explain why a share price on its own is not a good measure of the size of a company.',write:5},
'2.1':{lv:1,t:'Ouse Logistics plc has a market capitalisation of <b>£60 million</b> and <b>20 million</b> shares. Calculate its share price.',work:18,lines:['Share price = £ _']},
'2.2':{lv:1,t:'Ilkley Outdoor plc has a market capitalisation of <b>£45 million</b>. Its share price is <b>£5</b>. How many shares has it issued?',work:18,lines:['Number of shares = _']},
'2.3':{lv:1,t:'Rother Foods plc pays a dividend of <b>10p</b> per share. It has <b>30 million</b> shares. How much did it pay out in total dividends?',work:18,lines:['Total dividends = £ _']},
'2.4':{lv:2,t:'Nidd Media plc has a market capitalisation of <b>£390 million</b> and <b>150 million</b> shares. Calculate its share price in <b>pence</b>.',work:18,lines:['Share price = _ p']},
'2.5':{lv:2,t:'Derwent Hotels plc has a market capitalisation of <b>£84 million</b> and a share price of <b>350p</b>. How many shares has it issued?',work:20,lines:['Number of shares = _']},
'2.6':{lv:2,t:'Hull Marine plc paid total dividends of <b>£13.5 million</b> at a DPS of <b>4.5p</b>. How many shares does it have?',work:20,lines:['Number of shares = _']},
'2.7':{lv:2,t:'Each row is missing a different figure. Complete the table.',table:tbl(['Company','Share price','Number of shares','Market capitalisation'],[['A plc','','40 million','£100 million'],['B plc','75p','','£30 million'],['C plc','£8.20','15 million','']]),work:16},
'2.8':{lv:3,t:'Holme Valley Energy plc has a market capitalisation of <b>£1.8 billion</b> and a share price of <b>450p</b>. It pays a DPS of <b>12p</b>. Calculate the total dividends it pays.',work:22,lines:['Total dividends = £ _']},
'2.9':{lv:3,t:'Skipton Software plc paid <b>£22 million</b> in dividends at a DPS of <b>5.5p</b>. Its share price is <b>£2.10</b>. Calculate its market capitalisation.',work:46,lines:['Market capitalisation = £ _']},
