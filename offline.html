<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>You're offline | BIZ-OMICS</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#070b16">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(60% 50% at 20% 10%,rgba(245,158,11,.14),transparent 70%),
               radial-gradient(60% 50% at 85% 90%,rgba(59,130,246,.16),transparent 70%),#070b16;
    color:#f1f5f9;font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
  .card{max-width:440px;width:100%;text-align:center;background:#0e1424;
    border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:36px 28px}
  img{width:88px;height:88px;border-radius:20px}
  h1{font-size:1.5rem;margin:18px 0 8px;letter-spacing:-.01em}
  p{color:#94a3b8;margin:0 0 24px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button,a{appearance:none;border:0;border-radius:12px;padding:12px 18px;font:600 15px system-ui,sans-serif;
    cursor:pointer;text-decoration:none}
  button{background:#f59e0b;color:#111}
  a{background:#111a2e;color:#f1f5f9;border:1px solid rgba(255,255,255,.09)}
</style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="BIZ-OMICS">
    <h1>You're offline</h1>
    <p>This page hasn't been saved on this device yet. Pages you've opened before will still work. Reconnect to load new ones.</p>
    <div class="row">
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="/">Home</a>
    </div>
  </main>
</body>
</html>
